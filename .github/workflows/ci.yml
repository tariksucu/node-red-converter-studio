name: CI

on:
  pull_request:
    paths-ignore:
      - '**.md'
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'

# Cancel in-progress runs for the same branch/PR to avoid wasting CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      # Dependencies' install scripts are not needed to lint or test.
      - name: Install dependencies
        run: 'npm ci --ignore-scripts'

      - name: Run lint
        run: 'npm run lint'

      # Node-RED's test helper and a local stand-in for the API: no network, no API key.
      - name: Run tests
        run: 'npm test'

      # The Flow Library's scorecard (node-red-dev): naming, keyword, Node-RED and Node.js
      # versions, unique node names, examples, dependencies. It reads the library's catalogue
      # and the npm registry.
      - name: Validate for the Node-RED Flow Library
        run: 'npm run validate'

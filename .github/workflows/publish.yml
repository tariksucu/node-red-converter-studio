# Publishes @converterstudio/node-red-converter-studio to npm on every version tag
# push, with an npm provenance statement: anyone can verify that a version was
# built by this workflow, from this repository and commit.
#
# ─── ONE-TIME SETUP ────────────────────────────────────────────────────────────
#
# First publish — npm token (a trusted publisher can only be added once the
# package exists on npm):
#   1. On npmjs.com: Access Tokens → Generate New Token → Granular Access Token,
#      "Read and write", "Bypass two-factor authentication" on, short expiry.
#   2. In GitHub: Settings → Secrets and variables → Actions → New repository
#      secret named NPM_TOKEN, with the token as its value.
#
# Later publishes — OIDC trusted publishing (no long-lived secret):
#   1. On npmjs.com, the package's Settings → Trusted Publisher → GitHub Actions:
#        Repository owner: tariksucu
#        Repository name:  node-red-converter-studio
#        Workflow name:    publish.yml
#        Environment:      (leave blank)
#   2. Delete the NPM_TOKEN secret here and revoke the token on npm. Without
#      the secret, npm authenticates with GitHub's OIDC token instead.
#
# Both ways publish with provenance (trusted publishing adds it by itself).
# npm trusted publishing needs Node.js 22.14.0+ and npm 11.5.1+, which the
# steps below set up.
#
# ─── RELEASE PROCESS ───────────────────────────────────────────────────────────
#
# Change the version in package.json, CHANGELOG.md and the README, commit, then:
#
#   git tag X.Y.Z && git push origin main X.Y.Z
#
# Tags matching "*.*.*" start this workflow (1.0.1; v1.0.1 works too). The tag,
# without a leading "v", must equal the version in package.json. Once the new
# version is on npm, ask the Node-RED Flow Library to read it again: the
# "check for update" link on the node's page, or the form on
# https://flows.nodered.org/add/node.

name: Publish

on:
  push:
    tags:
      - '*.*.*'

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest

    permissions:
      contents: read
      # OIDC token for the provenance statement and trusted publishing.
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Use npm 11.5.1 or newer (trusted publishing)
        run: 'npm install --global npm@^11.5.1'

      - name: Check that the tag is the package version
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match version $version in package.json"
            exit 1
          fi

      # Dependencies' install scripts are not needed, and none runs in a job
      # that can publish.
      - name: Install dependencies
        run: 'npm ci --ignore-scripts'

      - name: Run lint
        run: 'npm run lint'

      # Node-RED's test helper and a local stand-in for the API: no network, no API key.
      - name: Run tests
        run: 'npm test'

      - name: Publish to npm with provenance
        run: |
          if [ -n "$NPM_TOKEN" ]; then
            npm config set //registry.npmjs.org/:_authToken "$NPM_TOKEN"
          fi
          npm publish --provenance --access public
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

<!-- prettier-ignore -->
<script type="text/markdown" data-help-name="converter-studio-account">
Reads the [Converter Studio](https://converter.studio) account of the config node's API key: its plan, the credits left and its limits.

### Outputs

: payload (object) : the account: `plan`, `credits` (left now), `allowance`, `packs`, `renewsAt`, `maxFileBytes` (the largest file it can convert) and `maxMediaSeconds`.

### Details

Use it to check the API key, or the credits before a large batch of files. It costs nothing.

### Errors

A wrong key stops the message with the code `invalidApiKey` in `msg.error.code`.

### References

- [Pricing](https://converter.studio/pricing)
</script>

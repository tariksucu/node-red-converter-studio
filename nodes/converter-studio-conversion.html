<script type="text/javascript">
  RED.nodes.registerType('converter-studio-conversion', {
    category: 'Converter Studio',
    color: '#E9967A',
    defaults: {
      name: { value: '' },
      server: { value: '', type: 'converter-studio-config', required: true },
      action: { value: 'get' },
      conversionId: { value: 'conversion.id', required: true },
      conversionIdType: { value: 'msg' },
      wait: { value: true },
      output: { value: 'buffer' },
      timeout: {
        value: 600,
        validate: function (v) {
          return /^\d+$/.test(String(v)) && Number(v) > 0;
        },
      },
    },
    inputs: 1,
    outputs: 1,
    icon: 'converter-studio.svg',
    paletteLabel: 'conversion',
    label: function () {
      return this.name || (this.action === 'confirm' ? 'confirm conversion' : 'get conversion');
    },
    labelStyle: function () {
      return this.name ? 'node_label_italic' : '';
    },
    oneditprepare: function () {
      $('#node-input-conversionId').typedInput({
        default: 'msg',
        types: ['msg', 'flow', 'global', 'str', 'env'],
        typeField: '#node-input-conversionIdType',
      });
      var toggle = function () {
        $('.converter-studio-wait').toggle($('#node-input-wait').is(':checked'));
      };
      $('#node-input-wait').on('change', toggle);
      toggle();
    },
  });
</script>

<script type="text/markdown" data-help-name="converter-studio-conversion">
Gets a [Converter Studio](https://converter.studio) conversion by its ID, with its result once it is done, or confirms one that was quoted.

### Inputs

: conversion.id (string) : the conversion's ID, as a **convert** node puts it in `msg.conversion`. **Conversion** sets where the node reads it; it may also point at an object with an `id`.

### Outputs

: payload (Buffer | string | object) : once the conversion is done, the file as a Buffer or its download link, as **Output** says; otherwise the conversion.
: filename (string) : the converted file's name, once it is done.
: contentType (string) : its media type (Buffer output only).
: conversion (object) : the conversion: `id`, `status`, `credits`, `outputName`, `downloadUrl`, `expiresAt`, `error` and more.

### Details

**Get** reads the conversion: use it after a **convert** node's timeout, or in a flow that an **http in** node starts when Converter Studio calls the convert node's callback URL (the conversion's ID is then in `msg.payload.conversion.id`). A conversion that failed is sent on with `msg.conversion.status` set to `failed` and the reason in `msg.conversion.error`, so check the status, for example with a **switch** node.

**Confirm** starts a conversion that a **convert** node quoted because it costs more than its max credits, for example after an approval. A confirmed conversion that fails stops the message with an error.

**Wait until it is finished** (on by default) waits up to **Timeout** seconds; without it the node sends the conversion as it is right away.

Conversions are kept for 6 hours, and only the account that started one can see it.

### Errors

Errors carry Converter Studio's own message; a **catch** node gets the code in `msg.error.code` (such as `notFound`, `fileExpired`, `notEnoughCredits` or `timeout`).

### References

- [Converter Studio API](https://converter.studio/developers)
</script>
